[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inspirehep2bib"
dynamic = ["version"]
description = ''
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = []
authors = [
  { name = "Alexander Puck Neuwirth", email = "alexander@neuwirth-informatik.de" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = []

[project.scripts]
inspirehep2bib = "inspirehep2bib:main"

[project.urls]
Documentation = "https://github.com/APN-Pucky/inspirehep2bib#readme"
Issues = "https://github.com/APN-Pucky/inspirehep2bib/issues"
Source = "https://github.com/APN-Pucky/inspirehep2bib"

[tool.hatch.version]
path = "src/inspirehep2bib/__about__.py"

[tool.hatch.envs.types]
extra-dependencies = [
  "mypy>=1.0.0",
]
[tool.hatch.envs.types.scripts]
check = "mypy --install-types --non-interactive {args:src/inspirehep2bib tests}"

[tool.coverage.run]
source_pkgs = ["inspirehep2bib", "tests"]
branch = true
parallel = true
omit = [
  "src/inspirehep2bib/__about__.py",
]

[tool.coverage.paths]
inspirehep2bib = ["src/inspirehep2bib", "*/inspirehep2bib/src/inspirehep2bib"]
tests = ["tests", "*/inspirehep2bib/tests"]

[tool.coverage.report]
exclude_lines = [
  "no cov",
  "if __name__ == .__main__.:",
  "if TYPE_CHECKING:",
]
